name: fuelconnect
description: FuelOnDemand - on-demand fuel delivery app (Flutter frontend).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  flutter_secure_storage: ^10.0.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  crypto: ^3.0.3
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.2
  geocoding: ^5.0.1
  http: ^1.6.0
  google_sign_in: 6.2.1
  google_sign_in_platform_interface: 2.5.0
  google_sign_in_web: 0.12.4+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
