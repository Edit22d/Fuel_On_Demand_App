{% load static fc %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>500 · Something broke · FuelOnDemand</title>
  <link rel="icon" href="{% static 'dashboard/img/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/console.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/pages.css' %}">
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:32px">
    <div class="card pad" style="width:min(520px,100%);text-align:center">
      <span class="brand-mark" style="margin:0 auto 18px">{% icon "alert" 22 "2.1" %}</span>
      <div class="eyebrow">500 · Server error</div>
      <h1 class="detail-title">That one is on us</h1>
      <p class="page-sub" style="margin:8px auto 22px">
        The console hit an unexpected error. The incident was logged; retry in a moment or head back to the overview.
      </p>
      <div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap">
        <a class="btn btn-gold" href="{% url 'console:overview' %}">{% icon "refresh" 16 %} Try again</a>
        <a class="btn btn-ghost" href="/">API status</a>
      </div>
    </div>
  </main>
</body>
</html>
