{% load static fc %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 · Not found · FuelOnDemand</title>
  <link rel="icon" href="{% static 'dashboard/img/favicon.png' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/console.css' %}">
  <link rel="stylesheet" href="{% static 'dashboard/css/pages.css' %}">
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:32px">
    <div class="card pad" style="width:min(520px,100%);text-align:center">
      <span class="brand-mark" style="margin:0 auto 18px">{% icon "search" 22 "2.1" %}</span>
      <div class="eyebrow">404 · Missing</div>
      <h1 class="detail-title">Nothing here</h1>
      <p class="page-sub" style="margin:8px auto 22px">
        That order, rider or page no longer exists. It may have been merged, renamed or removed.
      </p>
      <div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap">
        <a class="btn btn-gold" href="{% url 'console:overview' %}">{% icon "overview" 16 %} Overview</a>
        <a class="btn btn-ghost" href="{% url 'console:orders' %}">Search orders</a>
      </div>
    </div>
  </main>
</body>
</html>
